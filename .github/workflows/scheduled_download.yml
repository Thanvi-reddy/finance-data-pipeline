name: Scheduled Stock Download
on:
  workflow_dispatch:
  repository_dispatch:
    types: [supabase-trigger]

# Prevents overlapping/piled-up runs: if a run is already in progress,
# the next trigger waits in a single-slot queue instead of GitHub
# spinning up many concurrent jobs.
concurrency:
  group: scheduled-stock-download
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Market-hours guard
        id: guard
        continue-on-error: true
        run: python scripts/market_guard.py
      - name: Run pipeline (data/raw already up to date from git checkout)
        if: steps.guard.outcome == 'success'
        run: |
          mkdir -p logs
          echo "RUN $(date -u) - market open, downloading" | tee -a logs/run.log
          python finance_pipeline.py 2>&1 | tail -40 | tee -a logs/pipeline_detail.log
          echo "RUN $(date -u) - download complete" | tee -a logs/run.log
      - name: Log skip (market closed)
        if: steps.guard.outcome == 'failure'
        run: |
          mkdir -p logs
          echo "SKIP $(date -u) - market closed" | tee -a logs/run.log
      - name: Commit logs and data
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add logs/ data/raw/ data/earliest_dates_summary.csv data/pipeline.log || true
          git commit -m "scheduled run $(date -u)" || echo 'nothing to commit'
          git pull --no-rebase --depth=1 --strategy-option=ours || true
          git push || echo 'nothing to push'