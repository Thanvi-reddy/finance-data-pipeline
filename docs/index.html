<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger — Live Ticker Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.32.0/plotly.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --ink:#0B0E14;
    --panel:#12161F;
    --panel-2:#171C27;
    --line:#242B38;
    --text:#E7ECF3;
    --muted:#8A93A6;
    --gain:#3FBF8F;
    --loss:#E5615A;
    --accent:#6E8CFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    font-variant-numeric: tabular-nums;
    display:flex;
    min-height:100vh;
  }
  ::selection{background:var(--accent);color:#fff;}

  /* Sidebar */
  #sidebar{
    width:260px;
    flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    height:100vh;
    position:sticky;
    top:0;
  }
  #brand{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
  }
  #brand h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:19px;
    margin:0 0 2px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  #brand p{margin:0;color:var(--muted);font-size:12.5px;}
  #search-wrap{padding:14px 16px 8px;}
  #search{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 12px;
    border-radius:8px;
    font-size:13.5px;
    font-family:inherit;
  }
  #search:focus{outline:2px solid var(--accent);outline-offset:1px;}
  #search::placeholder{color:var(--muted);}
  #ticker-list{
    overflow-y:auto;
    flex:1;
    padding:4px 8px 16px;
  }
  .ticker-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 12px;
    border-radius:7px;
    cursor:pointer;
    margin-bottom:1px;
    font-size:13.5px;
  }
  .ticker-row:hover{background:var(--panel-2);}
  .ticker-row.active{background:rgba(110,140,255,0.14);}
  .ticker-row .sym{font-weight:600;}
  .ticker-row .chg{font-size:12px;color:var(--muted);}
  .ticker-row .chg.up{color:var(--gain);}
  .ticker-row .chg.down{color:var(--loss);}

  /* Main Workspace */
  #main{flex:1;min-width:0;padding:26px 36px 40px;}

  #market-overview{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--muted);
    font-size:13px;
    margin-bottom:20px;
  }
  #market-overview .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);}
  #market-overview b{color:var(--text);font-weight:600;}
  #market-overview .up-count{color:var(--gain);font-weight:600;}
  #market-overview .down-count{color:var(--loss);font-weight:600;}

  #topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:16px;
  }
  #price-block .sym-label{
    color:var(--muted);
    font-size:13px;
    margin-bottom:2px;
  }
  #price-block h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:32px;
    margin:0;
    display:flex;
    align-items:baseline;
    gap:12px;
    flex-wrap:wrap;
  }
  #price-block .delta{font-size:15px;font-weight:600;}
  #price-block .delta.up{color:var(--gain);}
  #price-block .delta.down{color:var(--loss);}

  #pipeline-status{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 16px;
    min-width:230px;
    font-size:12.5px;
    color:var(--muted);
  }
  #pipeline-status .row{display:flex;justify-content:space-between;margin-bottom:5px;}
  #pipeline-status .row:last-child{margin-bottom:0;}
  #pipeline-status .val{color:var(--text);font-weight:500;}
  #pulse{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--gain);margin-right:6px;
    box-shadow:0 0 0 0 rgba(63,191,143,0.5);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(63,191,143,0.5);}
    70%{box-shadow:0 0 0 6px rgba(63,191,143,0);}
    100%{box-shadow:0 0 0 0 rgba(63,191,143,0);}
  }

  /* KPI Grid */
  #kpi-row{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    margin-bottom:20px;
  }
  .kpi-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:13px 16px;
  }
  .kpi-card .kpi-label{color:var(--muted);font-size:12px;margin-bottom:6px;}
  .kpi-card .kpi-value{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600;}
  .kpi-card .kpi-value.up{color:var(--gain);}
  .kpi-card .kpi-value.down{color:var(--loss);}

  #range-tabs{display:flex;gap:6px;margin-bottom:12px;align-items:center;flex-wrap:wrap;}
  .range-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    padding:6px 13px;
    border-radius:7px;
    font-size:12.5px;
    font-family:inherit;
    cursor:pointer;
  }
  .range-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  #chart-wrap{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px 4px 4px;
  }
  #chart{height:400px;}
  #volume-chart{height:110px;border-top:1px solid var(--line);}

  @media (max-width:900px){#kpi-row{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:800px){
    #sidebar{position:fixed;left:-260px;z-index:10;transition:left .2s;}
    #sidebar.open{left:0;}
    #main{padding:20px;}
    #kpi-row{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<div id="sidebar">
  <div id="brand">
    <h1>Ledger</h1>
    <p>Live feed · 99 tickers</p>
  </div>
  <div id="search-wrap">
    <input id="search" placeholder="Search ticker…" autocomplete="off" />
  </div>
  <div id="ticker-list"></div>
</div>

<div id="main">
  <div id="market-overview">
    <span class="dot"></span>
    <span><b id="mo-total">99</b> tickers tracked · <span class="up-count" id="mo-up">—</span> up · <span class="down-count" id="mo-down">—</span> down</span>
  </div>

  <div id="topbar">
    <div id="price-block">
      <div class="sym-label" id="sym-label">AAPL</div>
      <h2 id="price-line"><span id="price">—</span><span class="delta" id="delta">—</span></h2>
    </div>
    <div id="pipeline-status">
      <div class="row"><span><span id="pulse"></span>Last pulled</span><span class="val" id="last-pulled">—</span></div>
      <div class="row"><span>Rows on file</span><span class="val" id="row-count">—</span></div>
      <div class="row"><span>Duplicates caught</span><span class="val" id="dupe-count">—</span></div>
    </div>
  </div>

  <div id="kpi-row">
    <div class="kpi-card">
      <div class="kpi-label">Current Price</div>
      <div class="kpi-value" id="kpi-price">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Day Change</div>
      <div class="kpi-value" id="kpi-change">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">High</div>
      <div class="kpi-value" id="kpi-high">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Low</div>
      <div class="kpi-value" id="kpi-low">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Volume</div>
      <div class="kpi-value" id="kpi-volume">—</div>
    </div>
  </div>

  <div id="range-tabs">
    <button class="range-btn active" data-n="10">10D</button>
    <button class="range-btn" data-n="30">30D</button>
    <button class="range-btn" data-n="90">90D</button>
    <button class="range-btn" data-n="365">1Y</button>
    <button class="range-btn" data-n="max">MAX</button>
  </div>

  <div id="chart-wrap">
    <div id="chart"></div>
    <div id="volume-chart"></div>
  </div>
</div>

<script>
  let activeTicker = 'AAPL';
  let activeRange = '10'; 
  let masterData = [];

  window.addEventListener('DOMContentLoaded', () => {
    initApp();
  });

  async function initApp() {
    setupEventListeners();
    await loadTickerData(activeTicker);
    buildTickerSidebar();
  }

  function setupEventListeners() {
    document.querySelectorAll('.range-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        activeRange = e.target.getAttribute('data-n');
        renderCharts();
      });
    });

    document.getElementById('search').addEventListener('input', (e) => {
      const term = e.target.value.toUpperCase();
      document.querySelectorAll('.ticker-row').forEach(row => {
        const sym = row.querySelector('.sym').textContent;
        row.style.display = sym.includes(term) ? 'flex' : 'none';
      });
    });
  }

  async function loadTickerData(ticker) {
    try {
      const response = await fetch(`AAPL_max.csv?t=${Date.now()}`);
      const csvText = await response.text();
      
      const parsed = Papa.parse(csvText, {
        header: true,
        dynamicTyping: true,
        skipEmptyLines: true
      });

      let seen = new Set();
      let uniqueRows = [];
      let duplicateCount = 0;

      parsed.data.forEach(row => {
        if (!row.Date || row.Close === undefined || row.Close === null) return;
        if (seen.has(row.Date)) {
          duplicateCount++;
        } else {
          seen.add(row.Date);
          uniqueRows.push(row);
        }
      });

      masterData = uniqueRows.sort((a, b) => new Date(a.Date) - new Date(b.Date));

      document.getElementById('row-count').textContent = masterData.length.toLocaleString();
      document.getElementById('dupe-count').textContent = duplicateCount.toLocaleString();
      document.getElementById('last-pulled').textContent = new Date().toLocaleTimeString();

      renderCharts();
    } catch (err) {
      console.error("Error executing data pipeline operation:", err);
    }
  }

  function renderCharts() {
    if (!masterData.length) return;

    let filteredData = [...masterData];
    if (activeRange !== 'max') {
      const limit = parseInt(activeRange, 10);
      filteredData = masterData.slice(-limit);
    }

    const dates = filteredData.map(d => d.Date);
    const closes = filteredData.map(d => d.Close);
    const volumes = filteredData.map(d => d.Volume || 0);

    const latest = filteredData[filteredData.length - 1];
    const previous = filteredData[filteredData.length - 2] || latest;
    const delta = latest.Close - previous.Close;
    const pct = (delta / previous.Close) * 100;

    document.getElementById('price').textContent = `$${latest.Close.toFixed(2)}`;
    document.getElementById('delta').textContent = ` ${delta >= 0 ? '▲' : '▼'} $${Math.abs(delta).toFixed(2)} (${pct.toFixed(2)}%)`;
    document.getElementById('delta').className = `delta ${delta >= 0 ? 'up' : 'down'}`;

    document.getElementById('kpi-price').textContent = `$${latest.Close.toFixed(2)}`;
    document.getElementById('kpi-change').textContent = `${pct.toFixed(2)}%`;
    document.getElementById('kpi-change').className = `kpi-value ${pct >= 0 ? 'up' : 'down'}`;
    document.getElementById('kpi-high').textContent = `$${Math.max(...filteredData.map(d => d.High || d.Close)).toFixed(2)}`;
    document.getElementById('kpi-low').textContent = `$${Math.min(...filteredData.map(d => d.Low || d.Close)).toFixed(2)}`;
    document.getElementById('kpi-volume').textContent = latest.Volume ? latest.Volume.toLocaleString() : '—';

    const chartStyle = {
      plot_bgcolor: '#12161F',
      paper_bgcolor: '#12161F',
      font: { color: '#E7ECF3', family: 'Inter, sans-serif' },
      margin: { t: 15, r: 20, l: 40, b: 30 },
      xaxis: { gridcolor: '#242B38', zeroline: false },
      yaxis: { gridcolor: '#242B38', zeroline: false }
    };

    Plotly.newPlot('chart', [{
      x: dates,
      y: closes,
      type: 'scatter',
      mode: 'lines',
      line: { color: '#6E8CFF', width: 2 }
    }], chartStyle, { displayModeBar: false, responsive: true });

    Plotly.newPlot('volume-chart', [{
      x: dates,
      y: volumes,
      type: 'bar',
      marker: { color: '#3FBF8F' }
    }], { ...chartStyle, margin: { t: 5, r: 20, l: 40, b: 20 } }, { displayModeBar: false, responsive: true });
  }

  function buildTickerSidebar() {
    const list = document.getElementById('ticker-list');
    list.innerHTML = '';
    
    const sampleTickers = ['AAPL', 'MSFT', 'GOOGL', 'AMZN', 'NVDA', 'META', 'TSLA'];
    
    sampleTickers.forEach(sym => {
      const row = document.createElement('div');
      row.className = `ticker-row ${sym === activeTicker ? 'active' : ''}`;
      row.innerHTML = `<span class="sym">${sym}</span><span class="chg up">+1.2%</span>`;
      
      row.addEventListener('click', () => {
        document.querySelectorAll('.ticker-row').forEach(r => r.classList.remove('active'));
        row.classList.add('active');
        activeTicker = sym;
        document.getElementById('sym-label').textContent = sym;
        loadTickerData(sym);
      });
      list.appendChild(row);
    });

    document.getElementById('mo-up').textContent = '45';
    document.getElementById('mo-down').textContent = '54';
  }
</script>
</body>
</html>
